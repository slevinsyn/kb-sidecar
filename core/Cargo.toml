[package]
name = "kb-core"
version = "0.1.0"
edition = "2021"
description = "Conversation knowledge base: session nodes, training dataset and graph data"

[lib]
name = "kb_core"
path = "src/lib.rs"

[[bin]]
name = "kb"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
